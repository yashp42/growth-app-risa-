name: Validate growth analyst
on:
  pull_request:
  push:
    branches: [codex/analyst-grounding-reference-evaluation]
permissions:
  contents: read
jobs:
  native-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: node --test scripts/test-stage4-next.ts scripts/test-evaluation.ts
  typecheck-build-and-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx tsx scripts/render-voice-preview.ts
      - run: npx tsx --test scripts/test*.ts


      - name: Verify and prepare explicitly requested reviewer access (LIVE, no inference)
        if: github.head_ref == 'codex/dynamic-data-analyst'
        run: npx tsx scripts/smoke-reviewer-live.ts --prepare

      - name: LIVE dynamic demo acceptance (synthetic fixtures, no inference)
        if: github.head_ref == 'codex/live-dynamic-acceptance'
        run: npx tsx scripts/acceptance-dynamic-live.ts --confirm-demo-tests
